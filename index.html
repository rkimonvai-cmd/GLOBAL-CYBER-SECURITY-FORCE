<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLOBAL CYBER SECURITY FORCE</title>
    <style>
      :root {
        --bg: #05070d;
        --panel: rgba(12, 17, 20, 0.9);
        --green: #00ff9d;
        --green-2: #7bffcb;
        --cyan: #00d9ff;
        --yellow: #ffd166;
        --text: #dffef7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        width: min(100%, 900px);
        background: var(--panel);
        border: 2px solid var(--green);
        box-shadow: 0 0 25px rgba(0,255,157,0.30);
        padding: 28px 18px;
      }

      h1 {
        text-align: center;
        color: var(--green);
        letter-spacing: 2px;
        margin-bottom: 20px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: 700;
        color: var(--green-2);
      }

      input, select, textarea, button {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--green);
        background: rgba(0,0,0,0.2);
        color: var(--text);
        font-size: 16px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .file-box {
        border: 2px dashed var(--cyan);
        background: rgba(0,217,255,0.04);
        padding: 14px;
        cursor: pointer;
        color: var(--cyan);
        font-weight: 700;
      }

      .file-box input { display: none; }

      .file-name {
        display: block;
        margin-top: 8px;
        color: var(--green-2);
        font-size: 0.9rem;
      }

      .btn {
        margin-top: 12px;
        background: var(--green);
        color: #02140d;
        border: none;
        font-weight: 800;
        cursor: pointer;
      }

      .status {
        margin-top: 16px;
        text-align: center;
        min-height: 24px;
        color: var(--green-2);
      }

      @media (max-width: 768px) {
        .form-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>GLOBAL CYBER SECURITY FORCE</h1>

      <form id="joinForm" enctype="multipart/form-data">
        <div class="form-grid">
          <div class="field">
            <label>নাম *</label>
            <input type="text" name="fullName" required placeholder="আপনার পূর্ণ নাম" />
          </div>

          <div class="field">
            <label>Email *</label>
            <input type="email" name="email" required placeholder="you@example.com" />
          </div>

          <div class="field">
            <label>ফোন নম���বর *</label>
            <input type="tel" name="phone" required placeholder="+88017XXXXXXXX" />
          </div>

          <div class="field">
            <label>লিঙ্গ *</label>
            <select name="gender" required>
              <option value="">-- নির্বাচন করুন --</option>
              <option value="male">ছেলে</option>
              <option value="female">মেয়ে</option>
              <option value="prefer_not_to_say">বলতে অনিচ্ছুক</option>
            </select>
          </div>

          <div class="field full">
            <label>বাসা/ঠিকানা *</label>
            <textarea name="address" required placeholder="আপনার সম্পূর্ণ ঠিকানা লিখুন"></textarea>
          </div>

          <div class="field">
            <label>আপনি আগে কোনো group-এ ছিলেন? *</label>
            <select name="previousGroup" required>
              <option value="">-- নির্বাচন করুন --</option>
              <option value="yes">হ্যাঁ</option>
              <option value="no">না</option>
            </select>
          </div>

          <div class="field full">
            <label>কেন যোগ দিতে চান? *</label>
            <textarea name="reason" required placeholder="আপনি কেন যোগ দিতে চান, লিখুন"></textarea>
          </div>

          <div class="field full">
            <label>প্রোফাইল ফটো *(JPG/PNG/WebP)*</label>
            <label class="file-box">
              <input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp" required />
              <span>Choose file</span>
              <span class="file-name" data-file-for="profilePhoto">কোনো ফাইল নির্বাচন করা হয়নি</span>
            </label>
          </div>

          <div class="field full">
            <label>পরিচয়পত্রের ছবি *(ঐচ্ছিক)*</label>
            <label class="file-box">
              <input type="file" name="idPhoto" accept="image/jpeg,image/png,image/webp" />
              <span>Choose file</span>
              <span class="file-name" data-file-for="idPhoto">কোনো ফাইল নির্বাচন করা হয়নি</span>
            </label>
          </div>

          <div class="field full">
            <label>ভিডিও *(ঐচ্ছিক, 40 সেকেন্ডের মধ্যে)*</label>
            <label class="file-box">
              <input type="file" name="videoVerification" accept="video/mp4,video/webm,video/quicktime" />
              <span>Choose file</span>
              <span class="file-name" data-file-for="videoVerification">কোনো ফাইল নির্বাচন করা হয়নি</span>
            </label>
          </div>

          <div class="field full">
            <button type="submit" class="btn">Join Now ✅</button>
          </div>
        </div>
      </form>

      <div id="status" class="status"></div>
    </div>

    <script>
      const form = document.getElementById("joinForm");
      const status = document.getElementById("status");

      document.querySelectorAll("input[type='file']").forEach(input => {
        input.addEventListener("change", () => {
          const target = document.querySelector('[data-file-for="' + input.name + '"]');
          if (!target) return;
          target.textContent = input.files && input.files[0] ? input.files[0].name : "কোনো ফাইল নির্বাচন করা হয়নি";
        });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        status.textContent = "Sending...";
        try {
          const response = await fetch("https://your-render-app.onrender.com/api/submit", {
            method: "POST",
            body: formData
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Submission failed");
          }

          status.textContent = "✅ আপনার ফর্ম জমা দেওয়া হয়েছে";
          form.reset();
          document.querySelectorAll(".file-name").forEach(el => {
            el.textContent = "কোনো ফাইল নির্বাচন করা হয়নি";
          });

        } catch (error) {
          status.textContent = error.message || "Submission failed";
          console.error(error);
        }
      });
    </script>
  </body>
</html>
